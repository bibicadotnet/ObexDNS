name: Publish Bunny to Docker Hub

permissions:
  contents: read

on:
  push:
    branches:
      - bunny
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave blank to auto-detect from latest Git tag or package.json)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_docker:
    name: Build and Publish Multi-Arch Bunny Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Determine and sync package version
        id: meta
        run: |
          VERSION=""
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          if [ -n "${{ inputs.version }}" ]; then
            INPUT_VER="${{ inputs.version }}"
            VERSION="${INPUT_VER#v}"
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -n "$LATEST_TAG" ]; then
              VERSION="${LATEST_TAG#v}"
            fi
          fi

          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi

          npm version "${VERSION}-bunny.${SHORT_SHA}" --no-git-tag-version --allow-same-version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'bibica' }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: bibica/obexdns:bunny
          cache-from: type=gha
          cache-to: type=gha,mode=max