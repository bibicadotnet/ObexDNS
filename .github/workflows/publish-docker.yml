name: Publish Beta to Docker Hub

permissions:
  contents: read

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_docker:
    name: Build and Publish Multi-Arch Beta Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Determine beta tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BASE_VER=$(node -p "require('./package.json').version")
          npm version "${BASE_VER}-beta.${SHORT_SHA}" --no-git-tag-version --allow-same-version
          echo "tag=bibica/obexdns:beta-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'bibica' }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max